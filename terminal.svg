<svg xmlns="http://www.w3.org/2000/svg"
     width="680"
     height="320"
     viewBox="0 0 680 320"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Sebastián Siman - Terminal</title>
  <desc id="desc">Terminal retro verde neón con cursor parpadeante.</desc>

  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="680" height="320" rx="8" fill="#050805"/>
  <rect x="1" y="1" width="678" height="318" rx="7"
        fill="none" stroke="#16C60C" stroke-opacity=".65"/>

  <!-- Barra superior -->
  <rect width="680" height="30" rx="8" fill="#101810"/>
  <path d="M0 22 V30 H680 V22" fill="#101810"/>

  <circle cx="18" cy="15" r="4" fill="#16C60C"/>
  <circle cx="33" cy="15" r="4" fill="#16C60C" opacity=".55"/>
  <circle cx="48" cy="15" r="4" fill="#16C60C" opacity=".3"/>

  <text x="340" y="19"
        fill="#16C60C"
        font-family="monospace"
        font-size="11"
        text-anchor="middle">SeebaaSiman@GITHUB: ~</text>

  <!-- Texto de terminal -->
  <g fill="#16C60C"
     font-family="'Courier New', monospace"
     font-size="16"
     filter="url(#glow)">

    <text x="22" y="60">seba@github:~$ whoami</text>
    <text x="22" y="83">Sebastián Siman</text>

    <text x="22" y="116">seba@github:~$ cat profile.json</text>
    <text x="22" y="139">{</text>
    <text x="22" y="162">   "role": "Software Developer",</text>
    <text x="22" y="185">  "stack": ["html","CSS","JavaScript","React","Node.js","python"],</text>
    <text x="22" y="208">"location": "La Plata, Buenos Aires, Argentina"
,</text>
    <text x="22" y="231">  "interests": ["family","basket","football","music","AI","coding"]</text>

    <text x="22" y="254">}</text>
    <text x="22" y="287">seba@github:~$</text>
  </g>

  <!-- Cursor parpadeante -->
  <rect x="168" y="274" width="9" height="16" fill="#16C60C">
    <animate attributeName="opacity"
             values="1;1;0;0"
             keyTimes="0;0.45;0.5;1"
             dur="1s"
             repeatCount="indefinite"/>
  </rect>

</svg>